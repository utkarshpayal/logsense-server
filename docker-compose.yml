version: "3.9"

services:
  postgres:
    image: postgres:17

    container_name: logsense-postgres

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logsense

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: